# Continuous integration for the MailIntegrator WPF application.
#
# Runs the xUnit suite on every pull request (opened, updated with new commits,
# reopened) and on every push to the default branch. The suite is headless-safe:
# no test opens a real WPF window. The job is named `tests-run` so it can be
# required as a status check in the `master_ruleset` branch ruleset.
#
# The `workflow_call` trigger lets `.github/workflows/release.yml` run this exact
# suite before packaging, so a release can never ship an untested commit.

name: CI

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_call:

# A new push to a pull request cancels the previous run for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TEST_PROJECT: MailIntegrator.Tests/MailIntegrator.Tests.csproj

jobs:
  # Do not rename this job: `master_ruleset` requires the `tests-run` check.
  tests-run:
    name: tests-run
    runs-on: windows-latest

    # A hung test host must fail the check instead of holding the runner for hours.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$env:TEST_PROJECT"

      - name: Build
        # The repository builds warning-free, so a warning fails the check.
        run: dotnet build "$env:TEST_PROJECT" --configuration Release --no-restore -warnaserror

      - name: Test
        # `--blame-hang` writes a hang dump if a test wedges, so a stuck run still
        # produces a diagnosable failure instead of holding the runner. Coverage is
        # collected for information only; it never gates the build.
        run: >
          dotnet test "$env:TEST_PROJECT" --configuration Release --no-build
          --blame-hang --blame-hang-timeout 5m
          --collect "XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
