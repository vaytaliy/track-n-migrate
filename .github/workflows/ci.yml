# Continuous integration for the MailIntegrator WPF application.
#
# Runs the full xUnit suite on every pull request (opened, updated with new
# commits, reopened) and on every push to the default branch. The job is named
# `tests-run` so it can be required as a status check in the `protect-main`
# branch ruleset.

name: CI

on:
  pull_request:
  push:
    branches: [ master ]

# A new push to a pull request cancels the previous run for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TEST_PROJECT: MailIntegrator.Tests/MailIntegrator.Tests.csproj

jobs:
  tests-run:
    name: tests-run
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$env:TEST_PROJECT"

      - name: Build
        run: dotnet build "$env:TEST_PROJECT" --configuration Release --no-restore

      - name: Test
        run: dotnet test "$env:TEST_PROJECT" --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: ignore
